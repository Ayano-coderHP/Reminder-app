<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemindMe - Smart Task & Event Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: {
                            50: '#f0f4f8',
                            100: '#d9e2ec',
                            200: '#bccadc',
                            300: '#9fb3c8',
                            400: '#829ab1',
                            500: '#627d98',
                            600: '#486581',
                            700: '#334e68',
                            800: '#243b53',
                            900: '#102a43',
                            950: '#0b1d30',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334e68;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-navy-950 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-200">

    <!-- Navbar Header -->
    <header class="sticky top-0 z-30 bg-white/80 dark:bg-navy-900/80 backdrop-blur-md border-b border-slate-200 dark:border-navy-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-navy-700 text-white p-2.5 rounded-xl shadow-md flex items-center justify-center">
                    <i class="fa-solid font-bold fa-bell text-xl text-amber-400"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl text-navy-900 dark:text-white tracking-tight flex items-center gap-2">
                        RemindMe
                        <span class="text-xs font-normal bg-navy-100 dark:bg-navy-800 text-navy-700 dark:text-navy-200 px-2 py-0.5 rounded-full border border-navy-200 dark:border-navy-700">v2.0</span>
                    </h1>
                    <p class="text-xs text-slate-500 dark:text-navy-300 hidden sm:block">Smart Daily & Recurring Task Planner</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <!-- User Profile Selector -->
                <div class="flex items-center bg-slate-100 dark:bg-navy-800 rounded-xl p-1.5 border border-slate-200 dark:border-navy-700">
                    <div class="w-8 h-8 rounded-lg bg-navy-600 text-white flex items-center justify-center text-sm font-bold shadow-sm" id="userAvatar">
                        ?
                    </div>
                    <div class="ml-2 mr-1">
                        <label for="activeUserSelect" class="block text-[10px] uppercase font-semibold text-slate-400 dark:text-navy-300 -mb-1">Active User</label>
                        <select id="activeUserSelect" onchange="switchUser(this.value)" class="bg-transparent font-medium text-xs text-slate-700 dark:text-slate-200 focus:outline-none cursor-pointer pr-1">
                            <!-- Populated JS -->
                        </select>
                    </div>
                    <button onclick="promptNewUser()" title="Add / Switch User" class="p-1.5 text-navy-600 dark:text-navy-300 hover:bg-slate-200 dark:hover:bg-navy-700 rounded-lg transition">
                        <i class="fa-solid fa-user-plus text-xs"></i>
                    </button>
                </div>

                <!-- Theme Toggle Button -->
                <button id="themeToggleBtn" onclick="toggleDarkMode()" class="p-2.5 rounded-xl text-slate-600 dark:text-navy-200 bg-slate-100 dark:bg-navy-800 hover:bg-slate-200 dark:hover:bg-navy-700 transition" title="Toggle Light/Dark Theme">
                    <i class="fa-solid fa-moon text-base dark:hidden"></i>
                    <i class="fa-solid fa-sun text-base hidden dark:block text-amber-400"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main App Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <!-- Top Status & Notification Bar -->
        <div class="mb-6 p-4 rounded-2xl bg-gradient-to-r from-navy-800 to-navy-900 text-white shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3 text-center md:text-left">
                <div class="p-3 bg-white/10 rounded-xl backdrop-blur-sm hidden sm:block">
                    <i class="fa-solid fa-clock text-amber-400 text-2xl"></i>
                </div>
                <div>
                    <h2 class="text-base font-semibold" id="greetingMessage">Welcome to RemindMe</h2>
                    <p class="text-xs text-navy-200" id="liveClock">Loading current time...</p>
                </div>
            </div>

            <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                <button id="enableNotifBtn" onclick="requestNotificationPermission()" class="text-xs bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold px-3 py-2 rounded-xl transition shadow flex items-center gap-1.5">
                    <i class="fa-solid fa-bell font-bold"></i> Enable System Alerts
                </button>
                <button onclick="testAlarmSound()" class="text-xs bg-white/10 hover:bg-white/20 text-white font-medium px-3 py-2 rounded-xl transition border border-white/20 flex items-center gap-1.5" title="Test Alarm Audio">
                    <i class="fa-solid fa-volume-high"></i> Test Alarm
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Panel: Create / Edit Reminder Form -->
            <div class="lg:col-span-5 xl:col-span-4">
                <div class="bg-white dark:bg-navy-900 rounded-2xl shadow-sm border border-slate-200 dark:border-navy-800 p-5 sticky top-20">
                    <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-100 dark:border-navy-800">
                        <h2 class="text-base font-bold text-navy-900 dark:text-white flex items-center gap-2" id="formTitle">
                            <i class="fa-solid fa-circle-plus text-navy-600 dark:text-navy-400"></i>
                            New Reminder
                        </h2>
                        <span class="text-xs font-semibold px-2.5 py-1 bg-navy-50 dark:bg-navy-800 text-navy-700 dark:text-navy-300 rounded-lg" id="currentUserBadge">
                            @user
                        </span>
                    </div>

                    <form id="reminderForm" onsubmit="handleSaveReminder(event)" class="space-y-4">
                        <input type="hidden" id="reminderId" value="">

                        <!-- Title Field -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                                Reminder Title <span class="text-rose-500">*</span>
                            </label>
                            <input type="text" id="remTitle" required placeholder="e.g. Submit Assignment, Pitha Fest, Pay WiFi" 
                                class="w-full px-3.5 py-2 text-sm bg-slate-50 dark:bg-navy-950 border border-slate-200 dark:border-navy-700 rounded-xl focus:ring-2 focus:ring-navy-500 focus:border-navy-500 outline-none transition">
                        </div>

                        <!-- Date & Time Picker -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                                First Start Date & Time <span class="text-rose-500">*</span>
                            </label>
                            <input type="datetime-local" id="remDateTime" required 
                                class="w-full px-3.5 py-2 text-sm bg-slate-50 dark:bg-navy-950 border border-slate-200 dark:border-navy-700 rounded-xl focus:ring-2 focus:ring-navy-500 focus:border-navy-500 outline-none transition text-slate-800 dark:text-slate-200">
                        </div>

                        <!-- Category & Priority Row -->
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                                    Category
                                </label>
                                <select id="remCategory" class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-navy-950 border border-slate-200 dark:border-navy-700 rounded-xl focus:ring-2 focus:ring-navy-500 outline-none transition">
                                    <option value="Study">📚 Study</option>
                                    <option value="Work">💼 Work</option>
                                    <option value="Personal">🏡 Personal</option>
                                    <option value="Festival">🎉 Festival</option>
                                    <option value="Health">💊 Health</option>
                                    <option value="Urgent">🚨 Urgent</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                                    Priority
                                </label>
                                <select id="remPriority" class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-navy-950 border border-slate-200 dark:border-navy-700 rounded-xl focus:ring-2 focus:ring-navy-500 outline-none transition">
                                    <option value="Low">🟢 Low</option>
                                    <option value="Medium" selected>🟡 Medium</option>
                                    <option value="High">🔴 High</option>
                                </select>
                            </div>
                        </div>

                        <!-- Custom Daily Recurrence Section -->
                        <div class="p-3 bg-navy-50/50 dark:bg-navy-950/50 rounded-xl border border-navy-100 dark:border-navy-800/80">
                            <div class="flex items-center justify-between mb-2">
                                <label class="text-xs font-bold text-navy-900 dark:text-navy-200 flex items-center gap-1.5">
                                    <i class="fa-solid fa-arrows-rotate text-navy-600 dark:text-navy-400"></i> Daily Recurrence
                                </label>
                                <input type="checkbox" id="remRepeatToggle" onchange="toggleRepeatOptions()" class="w-4 h-4 text-navy-600 rounded border-slate-300 focus:ring-navy-500 cursor-pointer">
                            </div>

                            <div id="repeatSettings" class="hidden space-y-2 pt-1 border-t border-slate-200 dark:border-navy-800">
                                <p class="text-[11px] text-slate-500 dark:text-navy-300">
                                    Repeats daily at the exact time set above.
                                </p>
                                <div>
                                    <label class="block text-[11px] font-semibold text-slate-600 dark:text-slate-400 mb-1">Repeat Duration</label>
                                    <select id="remRepeatDuration" class="w-full px-2.5 py-1.5 text-xs bg-white dark:bg-navy-900 border border-slate-200 dark:border-navy-700 rounded-lg outline-none">
                                        <option value="7">7 Days (1 Week)</option>
                                        <option value="14">14 Days (2 Weeks)</option>
                                        <option value="30">30 Days (1 Month)</option>
                                        <option value="90">90 Days (3 Months)</option>
                                        <option value="indefinite">Indefinitely (Until deleted)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Notes / Description -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                                Notes / Additional Details
                            </label>
                            <textarea id="remNotes" rows="2" placeholder="Add extra details, links, or checklist items..." 
                                class="w-full px-3.5 py-2 text-sm bg-slate-50 dark:bg-navy-950 border border-slate-200 dark:border-navy-700 rounded-xl focus:ring-2 focus:ring-navy-500 focus:border-navy-500 outline-none transition"></textarea>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex items-center gap-2 pt-2">
                            <button type="submit" id="saveSubmitBtn" class="flex-1 bg-navy-700 hover:bg-navy-800 text-white font-semibold py-2.5 px-4 rounded-xl shadow transition text-sm flex items-center justify-center gap-2">
                                <i class="fa-solid fa-plus"></i> Save Reminder
                            </button>
                            <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden bg-slate-200 dark:bg-navy-800 text-slate-700 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-navy-700 font-semibold py-2.5 px-3 rounded-xl transition text-sm">
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Right Panel: Filterable Reminder Lists -->
            <div class="lg:col-span-7 xl:col-span-8 space-y-4">
                
                <!-- Filter Controls Header -->
                <div class="bg-white dark:bg-navy-900 rounded-2xl shadow-sm border border-slate-200 dark:border-navy-800 p-4 space-y-3">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div class="relative w-full sm:w-64">
                            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-400"></i>
                            <input type="text" id="searchQuery" oninput="renderReminders()" placeholder="Search reminders..." class="w-full pl-8 pr-3 py-1.5 text-xs bg-slate-50 dark:bg-navy-950 border border-slate-200 dark:border-navy-700 rounded-xl outline-none focus:ring-2 focus:ring-navy-500">
                        </div>

                        <!-- Filter options dropdowns -->
                        <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                            <!-- Category Filter -->
                            <select id="filterCategory" onchange="renderReminders()" class="text-xs bg-slate-50 dark:bg-navy-950 border border-slate-200 dark:border-navy-700 rounded-xl px-2.5 py-1.5 outline-none font-medium text-slate-600 dark:text-slate-300">
                                <option value="ALL">All Categories</option>
                                <option value="Study">📚 Study</option>
                                <option value="Work">💼 Work</option>
                                <option value="Personal">🏡 Personal</option>
                                <option value="Festival">🎉 Festival</option>
                                <option value="Health">💊 Health</option>
                                <option value="Urgent">🚨 Urgent</option>
                            </select>

                            <!-- Priority Filter -->
                            <select id="filterPriority" onchange="renderReminders()" class="text-xs bg-slate-50 dark:bg-navy-950 border border-slate-200 dark:border-navy-700 rounded-xl px-2.5 py-1.5 outline-none font-medium text-slate-600 dark:text-slate-300">
                                <option value="ALL">All Priorities</option>
                                <option value="High">🔴 High Priority</option>
                                <option value="Medium">🟡 Medium Priority</option>
                                <option value="Low">🟢 Low Priority</option>
                            </select>

                            <!-- Tab filter (Active/Completed) -->
                            <select id="filterStatus" onchange="renderReminders()" class="text-xs bg-slate-50 dark:bg-navy-950 border border-slate-200 dark:border-navy-700 rounded-xl px-2.5 py-1.5 outline-none font-medium text-slate-600 dark:text-slate-300">
                                <option value="ACTIVE">Active Reminders</option>
                                <option value="COMPLETED">Completed</option>
                                <option value="ALL">All Statuses</option>
                            </select>
                        </div>
                    </div>

                    <div class="flex items-center justify-between text-xs text-slate-500 dark:text-navy-300 pt-1 border-t border-slate-100 dark:border-navy-800">
                        <span id="filteredCountLabel">Showing 0 reminders</span>
                        <div class="flex items-center gap-3">
                            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-rose-500"></span> High</span>
                            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-amber-500"></span> Medium</span>
                            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Low</span>
                        </div>
                    </div>
                </div>

                <!-- Reminders Container Cards -->
                <div id="remindersContainer" class="space-y-3">
                    <!-- Dynamic Reminder Cards Injected Here -->
                </div>

            </div>
        </div>
    </main>

    <!-- Alarm Ringing Modal Dialog -->
    <div id="alarmModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-navy-900 rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl border-2 border-amber-400 animate-bounce-short">
            <div class="w-16 h-16 bg-amber-100 dark:bg-amber-900/40 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4 animate-pulse">
                <i class="fa-solid fa-bell text-3xl"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-900 dark:text-white" id="alarmModalTitle">Reminder Alert!</h3>
            <p class="text-xs text-navy-600 dark:text-navy-300 font-medium mt-1" id="alarmModalUser">For @username</p>
            <p class="text-sm text-slate-600 dark:text-slate-300 mt-2 bg-slate-100 dark:bg-navy-950 p-3 rounded-xl border border-slate-200 dark:border-navy-800" id="alarmModalNotes">
                No description provided.
            </p>

            <div class="mt-5 flex flex-col gap-2">
                <button onclick="stopAlarm(true)" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl transition text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-check-double"></i> Mark Completed & Dismiss
                </button>
                <button onclick="stopAlarm(false)" class="w-full bg-slate-200 dark:bg-navy-800 text-slate-700 dark:text-slate-300 hover:bg-slate-300 font-semibold py-2 rounded-xl transition text-xs">
                    Snooze / Just Dismiss Audio
                </button>
            </div>
        </div>
    </div>

    <script>
        // Data Structures & State Management
        let appState = {
            users: ['Alex', 'Sarah', 'Guest'],
            activeUser: 'Alex',
            reminders: [],
            darkMode: false
        };

        let activeAlarmAudioCtx = null;
        let alarmIntervalId = null;
        let currentRingingReminderId = null;

        // Initialize Application
        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            setupInitialUser();
            applyTheme();
            setDefaultDatetime();
            renderUserDropdown();
            renderReminders();
            startClockAndAlarmWatcher();
        });

        // Set default datetime picker to current time + 5 minutes
        function setDefaultDatetime() {
            const now = new Date();
            now.setMinutes(now.getMinutes() + 5);
            const isoStr = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
            document.getElementById('remDateTime').value = isoStr;
        }

        // Local Storage Utilities
        function loadFromLocalStorage() {
            const savedData = localStorage.getItem('remindme_app_data');
            if (savedData) {
                try {
                    appState = JSON.parse(savedData);
                    if (!appState.users || appState.users.length === 0) {
                        appState.users = ['Alex', 'Sarah', 'Guest'];
                    }
                    if (!appState.activeUser) appState.activeUser = appState.users[0];
                    if (!appState.reminders) appState.reminders = [];
                } catch (e) {
                    console.error("Error parsing local storage", e);
                }
            } else {
                // Seed sample reminder
                const tomorrow = new Date();
                tomorrow.setHours(tomorrow.getHours() + 2);
                const isoDate = new Date(tomorrow.getTime() - (tomorrow.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);

                appState.reminders = [
                    {
                        id: 'rem_' + Date.now(),
                        username: 'Alex',
                        title: 'Team Sync & Assignment Review',
                        datetime: isoDate,
                        category: 'Work',
                        priority: 'High',
                        repeat: true,
                        repeatDuration: '7', // 7 days
                        notes: 'Discuss project milestones and complete the assignment review.',
                        completed: false,
                        dismissedForDates: []
                    }
                ];
                saveToLocalStorage();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('remindme_app_data', JSON.stringify(appState));
        }

        // Theme Toggle Logic
        function toggleDarkMode() {
            appState.darkMode = !appState.darkMode;
            applyTheme();
            saveToLocalStorage();
        }

        function applyTheme() {
            if (appState.darkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        // User Management
        function setupInitialUser() {
            document.getElementById('currentUserBadge').textContent = '@' + appState.activeUser;
            updateUserAvatar(appState.activeUser);
        }

        function updateUserAvatar(username) {
            const avatar = document.getElementById('userAvatar');
            avatar.textContent = username.charAt(0).toUpperCase();
        }

        function renderUserDropdown() {
            const select = document.getElementById('activeUserSelect');
            select.innerHTML = '';
            
            // Add existing users
            appState.users.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u;
                opt.textContent = u;
                if (u === appState.activeUser) opt.selected = true;
                select.appendChild(opt);
            });

            // Option to filter for "ALL USERS"
            const optAll = document.createElement('option');
            optAll.value = '__ALL__';
            optAll.textContent = '🌐 View All Users';
            select.appendChild(optAll);
        }

        function switchUser(val) {
            if (val === '__ALL__') {
                appState.activeUser = 'ALL';
                document.getElementById('currentUserBadge').textContent = '🌐 All Users';
                document.getElementById('userAvatar').textContent = '👥';
            } else {
                appState.activeUser = val;
                document.getElementById('currentUserBadge').textContent = '@' + val;
                updateUserAvatar(val);
            }
            saveToLocalStorage();
            renderReminders();
        }

        function promptNewUser() {
            const name = prompt("Enter new username / profile name:");
            if (name && name.trim()) {
                const cleanName = name.trim();
                if (!appState.users.includes(cleanName)) {
                    appState.users.push(cleanName);
                }
                appState.activeUser = cleanName;
                saveToLocalStorage();
                renderUserDropdown();
                switchUser(cleanName);
            }
        }

        // Toggle Form Repeat Options
        function toggleRepeatOptions() {
            const checked = document.getElementById('remRepeatToggle').checked;
            const panel = document.getElementById('repeatSettings');
            if (checked) {
                panel.classList.remove('hidden');
            } else {
                panel.classList.add('hidden');
            }
        }

        // Save / Create Reminder
        function handleSaveReminder(e) {
            e.preventDefault();

            const id = document.getElementById('reminderId').value;
            const title = document.getElementById('remTitle').value.trim();
            const datetime = document.getElementById('remDateTime').value;
            const category = document.getElementById('remCategory').value;
            const priority = document.getElementById('remPriority').value;
            const repeat = document.getElementById('remRepeatToggle').checked;
            const repeatDuration = document.getElementById('remRepeatDuration').value;
            const notes = document.getElementById('remNotes').value.trim();

            const activeUser = appState.activeUser === 'ALL' ? (appState.users[0] || 'Guest') : appState.activeUser;

            if (id) {
                // Edit existing
                const index = appState.reminders.findIndex(r => r.id === id);
                if (index !== -1) {
                    appState.reminders[index] = {
                        ...appState.reminders[index],
                        title,
                        datetime,
                        category,
                        priority,
                        repeat,
                        repeatDuration,
                        notes
                    };
                }
            } else {
                // Create new
                const newReminder = {
                    id: 'rem_' + Date.now(),
                    username: activeUser,
                    title,
                    datetime,
                    category,
                    priority,
                    repeat,
                    repeatDuration,
                    notes,
                    completed: false,
                    dismissedForDates: []
                };
                appState.reminders.push(newReminder);
            }

            saveToLocalStorage();
            resetForm();
            renderReminders();
        }

        function editReminder(id) {
            const rem = appState.reminders.find(r => r.id === id);
            if (!rem) return;

            document.getElementById('reminderId').value = rem.id;
            document.getElementById('remTitle').value = rem.title;
            document.getElementById('remDateTime').value = rem.datetime;
            document.getElementById('remCategory').value = rem.category;
            document.getElementById('remPriority').value = rem.priority;
            document.getElementById('remRepeatToggle').checked = rem.repeat;
            document.getElementById('remRepeatDuration').value = rem.repeatDuration || '7';
            document.getElementById('remNotes').value = rem.notes || '';

            toggleRepeatOptions();

            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen-to-square text-amber-500"></i> Edit Reminder';
            document.getElementById('saveSubmitBtn').innerHTML = '<i class="fa-solid fa-check"></i> Update Reminder';
            document.getElementById('cancelEditBtn').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('reminderId').value = '';
            document.getElementById('remTitle').value = '';
            document.getElementById('remNotes').value = '';
            document.getElementById('remRepeatToggle').checked = false;
            toggleRepeatOptions();

            setDefaultDatetime();

            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-circle-plus text-navy-600 dark:text-navy-400"></i> New Reminder';
            document.getElementById('saveSubmitBtn').innerHTML = '<i class="fa-solid fa-plus"></i> Save Reminder';
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        function toggleComplete(id) {
            const rem = appState.reminders.find(r => r.id === id);
            if (rem) {
                rem.completed = !rem.completed;
                saveToLocalStorage();
                renderReminders();
            }
        }

        function deleteReminder(id) {
            if (confirm("Are you sure you want to delete this reminder?")) {
                appState.reminders = appState.reminders.filter(r => r.id !== id);
                saveToLocalStorage();
                renderReminders();
            }
        }

        // Render Reminder Cards
        function renderReminders() {
            const container = document.getElementById('remindersContainer');
            const searchQuery = document.getElementById('searchQuery').value.toLowerCase();
            const catFilter = document.getElementById('filterCategory').value;
            const prioFilter = document.getElementById('filterPriority').value;
            const statusFilter = document.getElementById('filterStatus').value;

            let filtered = appState.reminders.filter(r => {
                // Filter User
                if (appState.activeUser !== 'ALL' && r.username !== appState.activeUser) {
                    return false;
                }
                // Filter Category
                if (catFilter !== 'ALL' && r.category !== catFilter) return false;
                // Filter Priority
                if (prioFilter !== 'ALL' && r.priority !== prioFilter) return false;
                // Filter Status
                if (statusFilter === 'ACTIVE' && r.completed) return false;
                if (statusFilter === 'COMPLETED' && !r.completed) return false;
                // Search
                if (searchQuery) {
                    const matchTitle = r.title.toLowerCase().includes(searchQuery);
                    const matchNotes = (r.notes || '').toLowerCase().includes(searchQuery);
                    const matchUser = r.username.toLowerCase().includes(searchQuery);
                    if (!matchTitle && !matchNotes && !matchUser) return false;
                }
                return true;
            });

            // Sort: Upcoming / High Priority first
            filtered.sort((a, b) => new Date(a.datetime) - new Date(b.datetime));

            document.getElementById('filteredCountLabel').textContent = `Showing ${filtered.length} reminder${filtered.length === 1 ? '' : 's'}`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-white dark:bg-navy-900 rounded-2xl p-8 text-center border border-slate-200 dark:border-navy-800">
                        <div class="w-12 h-12 bg-navy-50 dark:bg-navy-800 text-navy-500 dark:text-navy-300 rounded-2xl flex items-center justify-center mx-auto mb-3">
                            <i class="fa-solid fa-clipboard-check text-xl"></i>
                        </div>
                        <h3 class="font-semibold text-slate-700 dark:text-slate-200 text-sm">No reminders found</h3>
                        <p class="text-xs text-slate-400 dark:text-navy-400 mt-1">Try tweaking filters or create a new reminder on the left panel.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(r => {
                const priorityBadge = getPriorityBadge(r.priority);
                const categoryIcon = getCategoryIcon(r.category);
                const formattedTime = formatDateTime(r.datetime);
                const isExpired = new Date(r.datetime) < new Date() && !r.completed;

                return `
                    <div class="bg-white dark:bg-navy-900 rounded-2xl p-4 shadow-sm border border-slate-200 dark:border-navy-800 hover:border-navy-300 dark:hover:border-navy-700 transition flex flex-col sm:flex-row items-start justify-between gap-4 ${r.completed ? 'opacity-60 bg-slate-50/50 dark:bg-navy-900/40' : ''}">
                        
                        <div class="flex items-start gap-3 w-full">
                            <!-- Custom Checkbox -->
                            <button onclick="toggleComplete('${r.id}')" class="mt-0.5 text-xl transition text-slate-300 hover:text-emerald-500 dark:text-navy-700 dark:hover:text-emerald-400">
                                ${r.completed ? '<i class="fa-solid fa-circle-check text-emerald-500"></i>' : '<i class="fa-regular fa-circle"></i>'}
                            </button>

                            <div class="flex-1 space-y-1">
                                <div class="flex flex-wrap items-center gap-2">
                                    <h3 class="font-semibold text-sm text-slate-900 dark:text-white ${r.completed ? 'line-through text-slate-400 dark:text-slate-500' : ''}">
                                        ${escapeHtml(r.title)}
                                    </h3>
                                    ${priorityBadge}
                                    <span class="text-[11px] px-2 py-0.5 rounded-full bg-slate-100 dark:bg-navy-800 text-slate-600 dark:text-navy-300 font-medium">
                                        ${categoryIcon} ${r.category}
                                    </span>
                                    ${r.username !== appState.activeUser ? `<span class="text-[10px] text-navy-500 dark:text-navy-300 font-semibold bg-navy-50 dark:bg-navy-800/80 px-2 py-0.5 rounded-md">@${escapeHtml(r.username)}</span>` : ''}
                                </div>

                                <div class="flex flex-wrap items-center gap-3 text-xs text-slate-500 dark:text-navy-300 pt-1">
                                    <span class="flex items-center gap-1 ${isExpired ? 'text-rose-500 font-semibold' : ''}">
                                        <i class="fa-regular fa-clock"></i> ${formattedTime}
                                        ${isExpired ? '(Overdue)' : ''}
                                    </span>

                                    ${r.repeat ? `
                                        <span class="flex items-center gap-1 text-navy-600 dark:text-navy-300 bg-navy-50 dark:bg-navy-800 px-2 py-0.5 rounded-md text-[10px] font-semibold">
                                            <i class="fa-solid fa-rotate text-[10px]"></i> Daily for ${r.repeatDuration === 'indefinite' ? 'Indefinite' : r.repeatDuration + 'd'}
                                        </span>
                                    ` : ''}
                                </div>

                                ${r.notes ? `
                                    <p class="text-xs text-slate-600 dark:text-slate-400 bg-slate-50 dark:bg-navy-950/60 p-2 rounded-lg border border-slate-100 dark:border-navy-800 mt-2">
                                        ${escapeHtml(r.notes)}
                                    </p>
                                ` : ''}
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex sm:flex-col items-center justify-end gap-1.5 w-full sm:w-auto pt-2 sm:pt-0 border-t sm:border-0 border-slate-100 dark:border-navy-800">
                            <button onclick="editReminder('${r.id}')" title="Edit Reminder" class="p-2 text-xs text-slate-500 dark:text-navy-300 hover:bg-slate-100 dark:hover:bg-navy-800 rounded-lg transition">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button onclick="deleteReminder('${r.id}')" title="Delete Reminder" class="p-2 text-xs text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/30 rounded-lg transition">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>

                    </div>
                `;
            }).join('');
        }

        // Helpers for styling tags
        function getPriorityBadge(priority) {
            switch (priority) {
                case 'High':
                    return '<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-rose-100 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300 border border-rose-200 dark:border-rose-900">🔴 High</span>';
                case 'Medium':
                    return '<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-amber-100 text-amber-700 dark:bg-amber-950/60 dark:text-amber-300 border border-amber-200 dark:border-amber-900">🟡 Medium</span>';
                default:
                    return '<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-900">🟢 Low</span>';
            }
        }

        function getCategoryIcon(cat) {
            switch (cat) {
                case 'Study': return '📚';
                case 'Work': return '💼';
                case 'Personal': return '🏡';
                case 'Festival': return '🎉';
                case 'Health': return '💊';
                case 'Urgent': return '🚨';
                default: return '📌';
            }
        }

        function formatDateTime(dtStr) {
            if (!dtStr) return '';
            const dt = new Date(dtStr);
            return dt.toLocaleString([], { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // Sound & Alarm Web Audio Engine
        function playAlarmTone() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;

                activeAlarmAudioCtx = new AudioContext();

                function playBeep() {
                    if (!activeAlarmAudioCtx) return;
                    const osc = activeAlarmAudioCtx.createOscillator();
                    const gain = activeAlarmAudioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, activeAlarmAudioCtx.currentTime); // Note A5
                    osc.frequency.exponentialRampToValueAtTime(440, activeAlarmAudioCtx.currentTime + 0.25);

                    gain.gain.setValueAtTime(0.3, activeAlarmAudioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, activeAlarmAudioCtx.currentTime + 0.25);

                    osc.connect(gain);
                    gain.connect(activeAlarmAudioCtx.destination);

                    osc.start();
                    osc.stop(activeAlarmAudioCtx.currentTime + 0.25);
                }

                playBeep();
                alarmIntervalId = setInterval(playBeep, 600);
            } catch (err) {
                console.error("Audio error:", err);
            }
        }

        function testAlarmSound() {
            playAlarmTone();
            setTimeout(() => {
                stopAlarmAudioOnly();
            }, 2500);
        }

        function stopAlarmAudioOnly() {
            if (alarmIntervalId) {
                clearInterval(alarmIntervalId);
                alarmIntervalId = null;
            }
            if (activeAlarmAudioCtx) {
                activeAlarmAudioCtx.close();
                activeAlarmAudioCtx = null;
            }
        }

        function stopAlarm(markCompleted = false) {
            stopAlarmAudioOnly();
            document.getElementById('alarmModal').classList.add('hidden');

            if (markCompleted && currentRingingReminderId) {
                toggleComplete(currentRingingReminderId);
            }
            currentRingingReminderId = null;
        }

        function requestNotificationPermission() {
            if ('Notification' in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        alert("System alerts enabled! You will now receive desktop notifications.");
                    } else {
                        alert("Notification permission denied or dismissed.");
                    }
                });
            } else {
                alert("Browser does not support desktop notifications.");
            }
        }

        // Background Alarm Watcher Loop
        function startClockAndAlarmWatcher() {
            setInterval(() => {
                const now = new Date();
                document.getElementById('liveClock').textContent = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) + ' - ' + now.toLocaleTimeString();

                checkDueReminders(now);
            }, 1000);
        }

        function checkDueReminders(now) {
            const currentYYYYMMDD = now.toISOString().slice(0, 10);
            const currentHHMM = now.toTimeString().slice(0, 5);

            appState.reminders.forEach(rem => {
                if (rem.completed) return;

                const remDate = new Date(rem.datetime);
                const remYYYYMMDD = remDate.toISOString().slice(0, 10);
                const remHHMM = remDate.toTimeString().slice(0, 5);

                let isDue = false;

                if (!rem.repeat) {
                    // One-time reminder trigger
                    if (remYYYYMMDD === currentYYYYMMDD && remHHMM === currentHHMM && now.getSeconds() === 0) {
                        isDue = true;
                    }
                } else {
                    // Daily Recurring Logic
                    const startDate = new Date(rem.datetime);
                    startDate.setHours(0,0,0,0);
                    const todayDate = new Date(now);
                    todayDate.setHours(0,0,0,0);

                    const diffTime = todayDate - startDate;
                    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

                    // Check if within duration limits
                    let isWithinDuration = false;
                    if (rem.repeatDuration === 'indefinite') {
                        isWithinDuration = diffDays >= 0;
                    } else {
                        const maxDays = parseInt(rem.repeatDuration, 10);
                        isWithinDuration = diffDays >= 0 && diffDays < maxDays;
                    }

                    // Check if time matches and hasn't been dismissed today
                    if (isWithinDuration && remHHMM === currentHHMM && now.getSeconds() === 0) {
                        if (!rem.dismissedForDates || !rem.dismissedForDates.includes(currentYYYYMMDD)) {
                            isDue = true;
                            if (!rem.dismissedForDates) rem.dismissedForDates = [];
                            rem.dismissedForDates.push(currentYYYYMMDD);
                            saveToLocalStorage();
                        }
                    }
                }

                if (isDue && currentRingingReminderId !== rem.id) {
                    triggerAlarmUI(rem);
                }
            });
        }

        function triggerAlarmUI(rem) {
            currentRingingReminderId = rem.id;

            // Show Modal
            document.getElementById('alarmModalTitle').textContent = rem.title;
            document.getElementById('alarmModalUser').textContent = `Assigned to @${rem.username} • ${rem.category}`;
            document.getElementById('alarmModalNotes').textContent = rem.notes || 'No extra notes specified.';
            document.getElementById('alarmModal').classList.remove('hidden');

            // Play sound
            playAlarmTone();

            // Native Browser Notification
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(`Reminder: ${rem.title}`, {
                    body: `@${rem.username} - ${rem.notes || 'Your scheduled reminder is due now!'}`,
                    icon: 'https://cdn-icons-png.flaticon.com/512/3602/3602145.png'
                });
            }
        }
    </script>
